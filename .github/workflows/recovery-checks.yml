name: Reservation recovery checks
on:
  push:
    branches:
      - work/recovery-reservations-20261017
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/recovery-status.test.mjs
      - run: npm run build
