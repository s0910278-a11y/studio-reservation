name: Reservation recovery checks
on:
  push:
    branches:
      - work/recovery-reservations-20261017
      - work/recovery-native-read-20261017
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node --experimental-strip-types --test tests/recovery-*.test.mjs
      # Match the existing lockfile's legacy peer dependency resolution.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Read-only GAS transport smoke check
        run: |
          node --input-type=module <<'NODE'
          import { fetchGasHttpsRead } from './src/lib/gas-native-read.mjs';
          const url='https://script.google.com/macros/s/AKfycbxOE4x6w2NNbbrXJ_NSqf2CaTT5LaWvKflPzQnB-jkOuh9mg2IwA9nPcky6fPqcM3Tz4w/exec?action=getEquipment';
          const started=Date.now();
          const res=await fetchGasHttpsRead(url,AbortSignal.timeout(15000));
          const result=await res.json();
          if(!res.ok || !result.success || !Array.isArray(result.data)) throw new Error('GAS read smoke check failed');
          console.log(JSON.stringify({status:res.status,items:result.data.length,elapsedMs:Date.now()-started}));
          NODE
