name: Read-only GAS network diagnostic
on:
  push:
    branches:
      - work/recovery-network-20261017
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/diagnose-gas-read.mjs
